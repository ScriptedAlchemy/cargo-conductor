<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cargo-conductor</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8e4d9;
        --muted: #9a9384;
        --line: rgba(232, 228, 217, 0.12);
        --panel: #16130f;
        --accent: #e3b341;
        --good: #7dce9a;
        --bad: #e07a5f;
        --warn: #e39a55;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #100e0b;
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      }
      body { padding: 20px 26px 30px; }
      main { max-width: 1060px; margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
      h1 { margin: 0; font-size: 1.3rem; letter-spacing: 0.03em; }
      #status { color: var(--muted); font-size: 0.9rem; }
      .grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 18px; }
      section {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 4px;
        padding: 12px 14px 14px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 0.76rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h2 .count { color: var(--muted); letter-spacing: 0.06em; }
      table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
      th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
      .empty { color: var(--muted); margin: 6px 0 0; font-size: 0.88rem; }
      .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 0.72rem; }
      .pill.done { background: rgba(125, 206, 154, 0.14); color: var(--good); }
      .pill.failed { background: rgba(224, 122, 95, 0.16); color: var(--bad); }
      .pill.killed { background: rgba(227, 154, 85, 0.16); color: var(--warn); }
      .cmd {
        font-family: var(--mono);
        font-size: 0.8rem;
        display: inline-block;
        max-width: 520px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      .ranas { color: var(--accent); font-size: 0.76rem; margin-top: 2px; }
      .ranas .cmd { max-width: 460px; font-size: 0.76rem; }
      .pkgcount { color: var(--muted); }
      .ticket { font-family: var(--mono); font-size: 0.8rem; white-space: nowrap; }
      .who {
        color: var(--muted);
        font-size: 0.82rem;
        white-space: nowrap;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-block;
        vertical-align: bottom;
      }
      .dur { font-family: var(--mono); font-size: 0.8rem; white-space: nowrap; }
      .est { color: var(--muted); font-size: 0.76rem; white-space: nowrap; }
      .chip {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 7px;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .path {
        font-family: var(--mono);
        font-size: 0.8rem;
        display: inline-block;
        max-width: 340px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      .stats { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-end; }
      .stat { min-width: 88px; }
      .stat b { display: block; font-size: 1.3rem; }
      .stat span { color: var(--muted); font-size: 0.78rem; }
      .meterstat { min-width: 150px; }
      .meter {
        margin-top: 5px;
        height: 6px;
        width: 140px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .meter-fill { height: 100%; background: var(--accent); }
      .refreshing {
        display: inline-block;
        margin-left: 7px;
        color: var(--accent);
        font-size: 0.58rem;
        vertical-align: 0.12em;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .error-line {
        margin-top: 12px;
        color: var(--bad);
        font-size: 0.84rem;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 3px;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        padding: 2px 7px;
      }
      button:hover { border-color: var(--accent); }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
